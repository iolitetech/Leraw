<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upright and italic</title>
<style>
@font-face { font-family: "Leraw"; src: url("../fonts/variable/Leraw%5Bwght%5D.woff2") format("woff2"); font-weight: 300 900; font-style: normal; }
@font-face { font-family: "Leraw"; src: url("../fonts/variable/Leraw-Italic%5Bwght%5D.woff2") format("woff2"); font-weight: 300 900; font-style: italic; }
body { margin: 0; background: #FFFFFF; font-family: "Leraw", sans-serif; }
</style>
</head>
<body>
<div style="width: 1600px; height: 560px; box-sizing: border-box; padding: 56px; background: #FFFFFF; color: #111214; font-family: Leraw, sans-serif">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #E4E4E0; border: 1px solid #E4E4E0; height: 446px">
<div style="background-color: #FFFFFF; background-image: repeating-linear-gradient(90deg, transparent 0 71px, #EFEFEC 71px 72px); padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 18px">
<span style="font-size: 80px; font-weight: 400; line-height: 1.15">Kurdî bi xweşî</span>
<span dir="rtl" lang="ckb" style="font-size: 80px; font-weight: 400; line-height: 1.35; text-align: left">ڕووبار و گوڵ</span>
<span style="font-size: 54px; font-weight: 700; color: #0F7A56" lang="kmr">Ji bilî çiyan dost tune</span>
</div>
<div style="background-color: #FFFFFF; background-image: repeating-linear-gradient(102deg, transparent 0 71px, #EFEFEC 71px 72px); padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 18px">
<span style="font-size: 80px; font-weight: 400; font-style: italic; line-height: 1.15">Kurdî bi xweşî</span>
<span dir="rtl" lang="ckb" style="font-size: 80px; font-weight: 400; font-style: italic; line-height: 1.35; text-align: left">ڕووبار و گوڵ</span>
<span style="font-size: 54px; font-weight: 700; font-style: italic; color: #0F7A56" lang="kmr">Ji bilî çiyan dost tune</span>
</div>
</div>
</div>
</body>
</html>
