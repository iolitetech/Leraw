<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leraw in use</title>
<style>
@font-face { font-family: "Leraw"; src: url("../fonts/variable/Leraw%5Bwght%5D.woff2") format("woff2"); font-weight: 300 900; font-style: normal; }
body { margin: 0; background: #FFFFFF; font-family: "Leraw", sans-serif; }
</style>
</head>
<body>
<div style="width: 1600px; height: 620px; box-sizing: border-box; padding: 56px; background: #FFFFFF; color: #111214; font-family: Leraw, sans-serif">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #E4E4E0; border: 1px solid #E4E4E0; height: 506px">
<div lang="kmr" style="background: #FFFFFF; padding: 48px; display: flex; flex-direction: column; gap: 24px">
<h3 style="margin: 0; font-size: 48px; font-weight: 700; color: #0F7A56">Rûbar û çiya</h3>
<p style="margin: 0; font-size: 28px; line-height: 1.7; font-weight: 400; color: #2A2B2F">Ez ji Kurdistanê me. Çiya, şev, dû û îro — rûbar di nav geliyê re diherike û stranên kevn tîne bîra me.</p>
</div>
<div dir="rtl" lang="ckb" style="background: #FFFFFF; padding: 48px; display: flex; flex-direction: column; gap: 24px">
<h3 style="margin: 0; font-size: 48px; font-weight: 700; color: #0F7A56">ڕووبار و چیا</h3>
<p style="margin: 0; font-size: 31px; line-height: 1.75; font-weight: 400; color: #2A2B2F">کۆژین و ڤیان چوونە بۆ باغەکە، ئاوی ساردیان دا بە خرینگ و عەگ و قوڵینگەکان، ئینجا پەروازەکانیان فڕاند، دواتریش هەموو حاجیلەکانیان لە ژێر دارەکان چنی.</p>
</div>
</div>
</div>
</body>
</html>
